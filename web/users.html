{{define "users"}}
<header class="page-head"><div><p class="eyebrow">系统管理</p><h1>账号管理</h1></div><button class="btn primary" data-dialog="create-user-dialog">创建账号</button></header>
<section class="cards users-grid">
{{range .Users}}<article class="user-card"><div class="user-avatar">{{slice .Username 0 1}}</div><div class="user-meta"><h3>{{.Username}}</h3><p><span class="badge {{if eq .Role "admin"}}accent{{end}}">{{if eq .Role "admin"}}管理员{{else}}用户{{end}}</span> {{if .Disabled}}<span class="badge danger-badge">已禁用</span>{{else}}<span class="badge success">正常</span>{{end}}</p><small>创建于 {{.CreatedAt}}</small></div><form method="post" action="/admin/users/update" class="user-settings"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="id" value="{{.ID}}"><label>配额（GB）<input type="number" name="quota_gb" min="1" max="1000" value="{{divGB .Quota}}"></label><label>重置密码<input type="password" name="password" minlength="10" placeholder="留空则不修改"></label><label class="check"><input type="checkbox" name="disabled" value="1" {{if .Disabled}}checked{{end}}> 禁用账号</label><button class="btn">保存修改</button></form></article>{{end}}
</section>
<dialog id="create-user-dialog"><form method="post" action="/admin/users/create" class="dialog-card"><button type="button" class="dialog-close">×</button><h2>创建账号</h2><input type="hidden" name="csrf" value="{{.CSRF}}"><label>用户名<input name="username" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,31}" placeholder="例如 wangxiaoming"></label><label>初始密码<input type="password" name="password" minlength="10" required></label><label>角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><label>存储配额（GB）<input type="number" name="quota_gb" min="1" max="1000" value="10" required></label><button class="btn primary wide">创建账号</button></form></dialog>
{{end}}
