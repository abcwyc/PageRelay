{{define "login"}}
<main class="login-wrap">
  <section class="login-card">
    <div class="brand-logo brand-login"><img src="/assets/hello-rental-logo.png" alt="哈啰租车"><small>PageRelay</small></div>
    {{if eq .Lang "en"}}
    <p class="eyebrow">Enterprise file space</p>
    <h1>Welcome back</h1>
    <p class="login-slogan">{{.Slogan}}</p>
    <p class="muted">Sign in to manage files and create share links.</p>
    {{else}}
    <p class="eyebrow">企业文件空间</p>
    <h1>欢迎回来</h1>
    <p class="login-slogan">{{.Slogan}}</p>
    <p class="muted">登录后管理文件、创建分享链接。</p>
    {{end}}
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/login" class="form-stack" id="login-form">
      {{if eq .Lang "en"}}
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary wide">Sign in</button>
      {{else}}
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary wide">登录</button>
      {{end}}
    </form>
  </section>
</main>
{{end}}
