{{define "change-password"}}
<main class="login-wrap">
  <section class="login-card">
    <div class="brand-logo brand-login"><img src="/assets/pagerelay-logo.svg" alt="PageRelay"></div>
    {{if eq .Lang "en"}}
    <p class="login-slogan">{{.Slogan}}</p>
    <p class="muted">Choose a password with at least 10 characters.</p>
    {{else}}
    <p class="login-slogan">{{.Slogan}}</p>
    <p class="muted">新密码至少 10 位。</p>
    {{end}}
    {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/change-password" class="form-stack" id="change-password-form">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      {{if eq .Lang "en"}}
      <label>Current password<input type="password" name="current" autocomplete="current-password" required autofocus></label>
      <label>New password<input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
      <label>Confirm new password<input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
      <button type="submit" class="btn primary wide">Set password</button>
      {{else}}
      <label>当前密码<input type="password" name="current" autocomplete="current-password" required autofocus></label>
      <label>新密码<input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
      <label>确认新密码<input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
      <button type="submit" class="btn primary wide">设置新密码</button>
      {{end}}
    </form>
    <form method="post" action="/logout" class="change-password-logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="link-button">退出登录</button>
    </form>
  </section>
</main>
{{end}}
